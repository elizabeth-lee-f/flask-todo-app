name: CI Native Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      # скачиваем код репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # устанавливаем Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # устанавливаем зависимости из requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # инициализация базы данных SQLite и запуск сервера
      - name: Init DB and Start Flask Server
        run: |
          python manage.py db init || true
          python manage.py db migrate || true
          python manage.py db upgrade || true
          
          python manage.py runserver &
          sleep 5

      # проверяем, что сервер отвечает
      - name: Smoke test Flask server
        run: |
          curl -f http://localhost:5000/ || exit 1
          echo "Smoke test passed! Server is running."