name: CI Native Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      # скачиваем код репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # устанавливаем Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # устанавливаем зависимости из requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # исправляем баг в репозитории (отсутствует модуль 'app')
      - name: Fix missing app module
        run: |
          # создаем файл app.py с функцией create_app
          cat > app.py << 'EOF'
          from application import create_app
          app = create_app()
          if __name__ == '__main__':
              app.run()
          EOF
          echo "Created app.py"

      # инициализация базы данных SQLite и запуск сервера
      - name: Init DB and Start Flask Server
        run: |
          # инициализация БД
          python manage.py db init || true
          python manage.py db migrate || true
          python manage.py db upgrade || true
          
          # запускаем сервер в фоне с сохранением логов
          nohup python manage.py runserver > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server started with PID: $SERVER_PID"
          
          # ждем и проверяем, что сервер запустился
          for i in {1..10}; do
            if curl -s http://localhost:5000/ > /dev/null 2>&1; then
              echo "Server is running on port 5000"
              break
            fi
            echo "Waiting for server... attempt $i"
            sleep 2
          done
          
          # показываем последние строки логов сервера
          echo "=== Server logs ==="
          cat server.log

      # проверяем, что сервер отвечает
      - name: Smoke test Flask server
        run: |
          curl -f http://localhost:5000/ || exit 1
          echo "Smoke test passed! Server is running."