name: CI Native Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flask
        run: |
          python -m pip install --upgrade pip
          pip install 'markupsafe<2.1.0'
          pip install flask

      - name: Create simple Flask app
        run: |
          cat > server.py << 'EOF'
          from flask import Flask
          app = Flask(__name__)
          
          @app.route('/')
          def hello():
              return 'OK'
          
          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=5000)
          EOF

      - name: Start server in background
        run: |
          python server.py &
          sleep 10
          echo "Server should be running"

      - name: Smoke test Flask server
        run: |
          curl -f http://localhost:5000/ && echo "SUCCESS: Server is running!" || echo "FAILED: Server is not responding"